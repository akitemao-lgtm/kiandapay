# Render Blueprint — KiandaPay (Next.js). Ver README → Deploy.
services:
  - type: web
    name: kiandapay
    runtime: node
    region: frankfurt # mais perto do Supabase (Frankfurt, eu-central-1)
    plan: free # o cron a cada 5 minutos evita que adormeça; conta para as 750 h grátis por mês da conta.
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://hfkgbizyrdpjtyzbgxzt.supabase.co
      # Chave pública (publishable): vai sempre para o browser; o acesso é limitado pelo RLS.
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_Jbn3To7j_tXvTDjyi50oVw_7amWmoQ8
      # Segredos: o Render pede o valor ao criar o serviço (nunca ficam no Git).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # Cifra os tokens da API de Conversões e da UTMify guardados na BD.
      # NÃO pode ser gerada pelo Render: uma chave nova torna ilegíveis os tokens já
      # guardados, e as vendas deixam de chegar ao Meta sem nada falhar à vista.
      # Numa instalação nova, gere-a uma vez e guarde-a: openssl rand -base64 32
      - key: META_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: META_GRAPH_VERSION
        value: v27.0
      # Até configurar Twilio/Resend, as mensagens só ficam no registo do servidor.
      - key: SMS_PROVIDER
        value: log
      - key: WHATSAPP_PROVIDER
        value: log
      - key: EMAIL_PROVIDER
        value: log

# O plano grátis não tem cron: /api/cron é chamado a cada 5 minutos pelo pg_cron do Supabase (migração 0012).
