# Render Blueprint — KiandaPay (Next.js). Ver README → Deploy.
services:
  - type: web
    name: kiandapay
    runtime: node
    region: frankfurt # mais perto do Supabase (Frankfurt, eu-central-1)
    plan: free # adormece após 15 min sem visitas: o primeiro lead espera ~1 min. Para a loja real, usar starter.
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://hfkgbizyrdpjtyzbgxzt.supabase.co
      # Chave pública (publishable): vai sempre para o browser; o acesso é limitado pelo RLS.
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_Jbn3To7j_tXvTDjyi50oVw_7amWmoQ8
      # Segredos: o Render pede o valor ao criar o serviço (nunca ficam no Git).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # 32 bytes aleatórios em base64, gerados pelo Render.
      - key: META_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v27.0
      # Até configurar Twilio/Resend, as mensagens só ficam no registo do servidor.
      - key: SMS_PROVIDER
        value: log
      - key: WHATSAPP_PROVIDER
        value: log
      - key: EMAIL_PROVIDER
        value: log

# O plano grátis não tem cron: /api/cron tem de ser chamado por um serviço externo, com o CRON_SECRET.
